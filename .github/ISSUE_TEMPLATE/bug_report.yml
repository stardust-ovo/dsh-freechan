name: 缺陷报告
description: 某个工具报错、卡住、返回不对
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        贴诊断信息前先跑 `node scripts/report.mjs`，把输出粘到下面「诊断信息」里。
        **不要贴 API key、cookie、令牌。**
  - type: dropdown
    id: tool
    attributes:
      label: 哪个工具出的问题
      options: [freeask, freejob, freechan_stats, freechan_doctor, freeimage, freecondense, teleagent, freechan_providers, freedispatch, 安装/加载]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: 插件版本
      description: package.json 里的 version，或 `node -p "require('./package.json').version"`
      placeholder: 0.2.2
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从「打开 DSH」开始写，一条命令一行
      placeholder: |
        1. freeask(prompt="只回复两个字：收到", channel="qwen")
        2. ...
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: 期望 vs 实际
    validations: { required: true }
  - type: textarea
    id: diag
    attributes:
      label: 诊断信息
      description: node scripts/report.mjs 的输出（已自动脱敏）
      render: text
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: apply.log / ask_log.jsonl 里相关片段（去掉密钥）
      render: text
