name: 功能建议
description: 想加一个工具、参数或行为
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你现在被什么卡住
      description: 说场景，不要说方案
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: 你想要的形态
      description: 工具名、参数、返回什么
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代做法
      description: 现有工具能不能绕过去？绕不过去的具体点在哪
